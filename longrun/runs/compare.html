vs 44s。省下的 2 笔残漏是拿 20 倍的输出换来的。</text><text x="56" y="530" font-size="11" fill="#5F5E5A">可见事件少 ≠ 暴露少：摘要只有 13 条可见事件（图记忆 25 条），残漏却更大（5 vs 4），还引入了全表唯一一次新泄露。因为摘要每次把整段历史塞进一条消息，密度更高。</text><text x="56" y="550" font-size="11" fill="#5F5E5A">任务完成率不能直接比：task_7 的 A 侧会把 200.0 抄成相邻交易的 100.0（读数错误，与记忆无关）；摘要档的 task_4 判 0 是被压缩错的金额带偏，属摘要本身的问题。残漏是确定性的，不受这些影响。</text><text x="40" y="592" font-size="10" fill="#888780">残漏 = prior 中本步仍出现且本步不需要的（字面内容命中口径）</text></svg></body></html>
